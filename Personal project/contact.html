<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="contact.css">
</head>
<body>

    <section id="contact">
  <div class="container contact-container">
    <h2>Contact Us</h2>
    <p>Have questions? Send us a message and we’ll get back to you!</p>
    <form id="contactForm">
      <input type="text" id="cname" name="cname" placeholder="Your Name" required>
      <input type="email" id="cemail" name="cemail" placeholder="Your Email" required>
      <textarea id="cmessage" name="cmessage" rows="5" placeholder="Your Message" required></textarea>
      <button type="submit">Send Message</button>
    </form>
    <p id="contactConfirmation"></p>
  </div>
</section>
    
</body>
</head>
